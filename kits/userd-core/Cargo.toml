[package]
name = "userd-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Tipos, configuración KDL y modelo de jobs de nixos-userd"

[dependencies]
kdl = "6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "1.0.69"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
