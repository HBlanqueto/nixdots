[package]
name = "nixdots-userd"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6.5"
nixdots-common = { path = "../nixdots-common" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zeroize = "1"
