# The precompiled GitHub-release binaries are linked with clang + lld: faster
# than the default gcc + GNU ld and it needs no musl-tools (clang links against
# the musl libc rustc already ships). Only these two musl targets are affected;
# native and development builds are untouched.
#
# `target-cpu=x86-64-v2` is the safe "modern CPU" baseline (SSE4.2/POPCNT,
# 2009+); the aarch64 baseline is left at rustc's default.
[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = [
    "-C", "target-cpu=x86-64-v2",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-O2",
    "-C", "link-arg=-Wl,--gc-sections",
]

[target.aarch64-unknown-linux-musl]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-O2",
    "-C", "link-arg=-Wl,--gc-sections",
]
